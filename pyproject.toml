[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "genshen-skin-cp8"
version = "0.1.0"
description = "原神 CP 壁纸套件 8 —— 胡桃 x 芙宁娜: 三张素材 x 三种摆法一键切换壁纸、桌面桌宠、多 IDE 皮肤 (VSCode/Trae/CodeX/JetBrains/Harness/ClaudeCode/KimiCode/DeepKing)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Mr.Water", email = "wph666@users.noreply.github.com" }]
keywords = [
    "genshin",
    "wallpaper",
    "skin",
    "desktop-pet",
    "ide-theme",
    "mcp",
    "deepking",
    "vscode",
    "jetbrains",
    "胡桃",
    "芙宁娜",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Multimedia :: Graphics",
    "Natural Language :: Chinese (Simplified)",
]
dependencies = ["pillow>=9.0"]

[project.optional-dependencies]
dev = ["build>=1.0", "twine>=4.0"]

[project.urls]
Homepage = "https://github.com/WPH666-py/Genshen-skin-CP8"
Repository = "https://github.com/WPH666-py/Genshen-skin-CP8"
Source = "https://github.com/WPH666-py/Genshen-skin-CP8"
"Bug Tracker" = "https://github.com/WPH666-py/Genshen-skin-CP8/issues"
"姊妹套件 CP1" = "https://github.com/WPH666-py/Genshen-Skin-CP1"

[project.scripts]
genshen-cp8 = "genshen_skin_cp8.engine.cli:main"
genshen-cp8-pet = "genshen_skin_cp8.engine.pet:main"
genshen-cp8-switcher = "genshen_skin_cp8.engine.switcher:main"
genshen-cp8-mcp = "genshen_skin_cp8.engine.mcp_server:main"
genshen-cp8-install = "genshen_skin_cp8.engine.autoinstall:main"
genshen-cp8-deepking = "genshen_skin_cp8.engine.deepking_cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genshen_skin_cp8 = ["engine/assets/*.jpg", "engine/assets/*.txt", "skin.json"]
